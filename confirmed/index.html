<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Email confirmed · VendorPro</title>
<link rel="icon" type="image/png" href="/img/icon-64.png">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1c150f; color: #f3e9d7; font: 17px/1.6 Karla, system-ui, -apple-system, Segoe UI, sans-serif; text-align: center; padding: 24px; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font: 800 32px/1.1 'Bricolage Grotesque', system-ui, sans-serif; margin: 20px 0 10px; }
  p { color: #a8967a; max-width: 34ch; margin: 0 auto 26px; }
  a.btn { display: inline-block; background: #7c52c9; color: #fff; text-decoration: none; font-weight: 700; padding: 14px 22px; border-radius: 12px; }
  .err h1 { color: #e0725f; }
</style>
</head>
<body>
<main id="page">
  <img src="/img/icon-180.png" alt="">
  <h1>You're confirmed</h1>
  <p>Your email is verified. Go back to VendorPro on your phone and sign in with your email and password.</p>
  <a class="btn" href="cardshowappv2://">Open VendorPro</a>
</main>
<script>
  // Supabase puts an error in the URL when a link has expired or was used already.
  const params = new URLSearchParams(location.hash.slice(1) + '&' + location.search.slice(1));
  if (params.get('error') || params.get('error_code')) {
    const page = document.getElementById('page');
    page.className = 'err';
    page.querySelector('h1').textContent = 'This link has expired';
    page.querySelector('p').textContent =
      'Confirmation links only work once and expire after a while. Try signing in to VendorPro; if it says your email isn’t confirmed, sign up again to get a fresh link.';
  }
  // the link carries a sign-in token for the website; nothing here uses it, so drop it from the address bar
  if (location.hash) history.replaceState(null, '', location.pathname);
</script>
</body>
</html>
